name: Build testing plugin

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Evernow/AnoMech
  SOURCE_BRANCH: mp-8-internaltls
  # Merged into SOURCE_BRANCH in this order before the build; space-separated, may be empty.
  MERGE_BRANCHES: fru-ur-spots
  INTERNAL_NAME: AnoMechTesting
  DISPLAY_NAME: AnoMech Testing

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: src
          # Every branch with its history, for the merges.
          fetch-depth: 0

      - name: Resolve source commits
        id: src
        shell: pwsh
        run: |
          $branches = @($env:SOURCE_BRANCH) + @($env:MERGE_BRANCHES -split '\s+' | Where-Object { $_ })
          $shas = @(foreach ($branch in $branches) {
            $sha = git -C src rev-parse --verify "origin/$branch"
            if ($LASTEXITCODE) { throw "$env:SOURCE_REPO has no branch $branch" }
            $sha.Trim()
          })
          $short = @($shas | ForEach-Object { $_.Substring(0,7) }) -join '-'
          $pairs = for ($i = 0; $i -lt $branches.Count; $i++) { "$($branches[$i]) $($shas[$i])" }
          "short=$short" >> $env:GITHUB_OUTPUT
          "tag=src-$short" >> $env:GITHUB_OUTPUT
          "label=$($branches -join ' + ')" >> $env:GITHUB_OUTPUT
          "notes=$env:SOURCE_REPO@$($pairs -join ' + ')" >> $env:GITHUB_OUTPUT

      # The cron fires whether or not a branch moved; the release tag names every source commit.
      - name: Skip commits already released
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ steps.src.outputs.tag }} --repo $env:GITHUB_REPOSITORY *> $null
          $done = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($done) { "build=false" >> $env:GITHUB_OUTPUT } else { "build=true" >> $env:GITHUB_OUTPUT }
          exit 0

      # Merge commits made here are never pushed.
      - name: Merge branches
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        run: |
          foreach ($branch in @($env:MERGE_BRANCHES -split '\s+' | Where-Object { $_ })) {
            git -C src -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com merge --no-edit "origin/$branch"
            if ($LASTEXITCODE) { throw "$branch does not merge cleanly into $env:SOURCE_BRANCH" }
          }

      - uses: actions/setup-dotnet@v5
        if: steps.gate.outputs.build == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      # Renamed at build time so the testing build installs alongside upstream's AnoMech and
      # keeps its own config. Only the plugin project is renamed: -p:AssemblyName would also
      # rename the relay project it references.
      - name: Build
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        run: |
          $proj = "src/AnoMech"
          $manifest = Get-Content "$proj/AnoMech.json" -Raw | ConvertFrom-Json
          $manifest.Name = $env:DISPLAY_NAME
          $manifest.RepoUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          $manifest.Punchline = "Testing build of $env:SOURCE_REPO@${{ steps.src.outputs.label }}."
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$proj/$env:INTERNAL_NAME.json" -Encoding UTF8

          $csproj = (Resolve-Path "$proj/AnoMech.csproj").Path
          $xml = [xml](Get-Content $csproj -Raw)
          $group = @($xml.Project.PropertyGroup | Where-Object { -not $_.Condition })[0]
          $assemblyName = $xml.CreateElement('AssemblyName')
          $assemblyName.InnerText = $env:INTERNAL_NAME
          [void]$group.AppendChild($assemblyName)
          $xml.Save($csproj)

          $parts = $xml.SelectSingleNode('//Version').InnerText.Split('.')
          $version = "$($parts[0]).$($parts[1]).$($parts[2]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_ENV

          dotnet build $csproj -c Release -p:Platform=x64 -p:Version=$version

      - name: Collect assets
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        run: |
          $json = Get-ChildItem src/AnoMech/bin -Recurse -Filter "$env:INTERNAL_NAME.json" | Select-Object -First 1
          $zip = Get-ChildItem src/AnoMech/bin -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $json -or -not $zip) { throw "packager produced no $env:INTERNAL_NAME.json / .zip" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $json.FullName "dist/$env:INTERNAL_NAME.json"
          Copy-Item $zip.FullName "dist/$env:INTERNAL_NAME.zip"

      # Sync.ps1 in Evernow/DalamudPlugins reads the latest release's two assets by these names.
      - name: Publish release
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.src.outputs.tag }} dist/* `
            --repo $env:GITHUB_REPOSITORY `
            --title "$env:version (${{ steps.src.outputs.short }})" `
            --notes "${{ steps.src.outputs.notes }}" `
            --latest
